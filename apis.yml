aid: dollar-tree
name: Dollar Tree
description: >-
  Dollar Tree is a leading operator of discount variety stores in North America,
  operating more than 16,000 stores under the Dollar Tree and Family Dollar
  banners. Vendor and supplier integration is primarily handled through EDI,
  SAP, and ERP systems via the Dollar Tree Vendor Portal. No public REST API
  is currently available.
