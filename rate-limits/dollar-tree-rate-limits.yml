description: Dollar Tree does not publish a public API or rate-limit documentation. Integration is via
  the Vendor Portal (EDI/SAP), where transmission cadence is governed by trading-partner agreements rather
  than per-second/per-minute throttles.
sources:
  - https://www.dollartree.com/
notes: No public REST API; reconciled=false. The single limit entry below is descriptive.
responseCodes: {}
limits:
  - name: Vendor portal / EDI cadence
    scope: trading-partner
    metric: varies
    limit: see Dollar Tree vendor agreement
    notes: EDI document cadence and acknowledgement windows are governed by the trading-partner agreement.
policies:
  - name: Trading-Partner Agreement
    description: Dollar Tree vendor integrations are governed by a trading-partner agreement that defines
      acceptable EDI transmission frequency, acknowledgement windows, and SLAs.
